  CM-17:
    - audit_test.go#TestAuditFiltersScopesAndProjection
    - audit_test.go#TestAuditSnapshotExcludesBackfillAndLateCommit
    - audit_test.go#TestAuditDefaultsAndTransactionRollback
    - audit_test.go#TestAuditBatchLimitAndRecordedOutcome
    - audit_test.go#TestAuditDecisionSavedIsNotExecutionSuccess
