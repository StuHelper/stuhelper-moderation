id: moderation
version: 0.6.0 # 模块清单版本。源码发行版本由 Git tag 标识。
kind: module
api: 1
critical: false
requires:
  - id: platform
    api: 1
optional:
  - id: verification
    api: 1
  - id: identity
    api: 1
capabilities:
  - moderation.tasks
# 任务 HTTP 能力由宿主关联当前身份。
capability_requires:
  moderation.tasks:
    - id: identity
      api: 1
# 规格场景对应的 Go 测试。scripts/check-module.mjs 核对每个函数引用。
